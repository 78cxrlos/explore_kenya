<!DOCTYPE html>
<html>
<head>
    <title>Gallery - Explore Kenya</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f2f2f2;
        }

        header {
            background-color: #111;
            color: white;
            padding: 25px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-size: 16px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            padding: 50px 20px;
            text-align: center;
        }

        h2 {
            margin-bottom: 40px;
            font-size: 28px;
        }

        .gallery-container {
            max-width: 1100px;
            margin: auto;
        }

        .gallery-item {
            margin-bottom: 50px;
        }

        .gallery-item img {
            width: 90%;
            max-width: 700px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.15);
        }

        .gallery-item p {
            margin-top: 15px;
            font-size: 18px;
            color: #444;
        }

        footer {
            background-color: #111;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>Explore Kenya</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="destinations.html">Destinations</a>
        <a href="gallery.html">Gallery</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>

    <h2>Gallery</h2>

    <div class="gallery-container">

        <div class="gallery-item">
            <img src="images/nairobi.jfif" alt="Nairobi skyline">
            <p>Nairobi City Skyline</p>
        </div>

        <div class="gallery-item">
            <img src="images/mombasa.jfif" alt="Mombasa beach">
            <p>Mombasa Beach</p>
        </div>

        <div class="gallery-item">
            <img src="images/masaimara.jpg" alt="Masai Mara wildlife">
            <p>Masai Mara Wildlife</p>
        </div>

        <div class="gallery-item">
            <img src="images/diani.jfif" alt="Diani beach">
            <p>Diani Beach</p>
        </div>

    </div>

</main>

<footer>
    <p>&copy; 2026 Explore Kenya</p>
</footer>

</body>
</html>
